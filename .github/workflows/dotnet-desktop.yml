name: RedLightForWindows CI

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: read

jobs:
  build-release:
    if: github.event_name == 'push'
    runs-on: windows-latest
    permissions:
      contents: write

    env:
      Configuration: Release

    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore RedLightForWindows.csproj

    - name: Publish single-file exe
      run: >
        dotnet publish RedLightForWindows.csproj
        --configuration ${{ env.Configuration }}
        --runtime win-x64
        --self-contained true
        -p:PublishSingleFile=true
        -p:IncludeNativeLibrariesForSelfExtract=true
        --output ./publish
        -p:Version=${{ github.run_number }}

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: RedLightForWindows
        path: publish/RedLightForWindows.exe

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: ncipollo/release-action@v1
      with:
        artifacts: publish/RedLightForWindows.exe
        body: "Automated release from GitHub Actions"
        token: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL
    runs-on: windows-latest
    permissions:
      security-events: write

    steps:
    - uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: csharp

    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL analysis
      uses: github/codeql-action/analyze@v3

  secret-scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Run Gitleaks
      uses: gitleaks/gitleaks-action@v2
      with:
        fail: true
